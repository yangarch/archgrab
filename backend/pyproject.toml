[project]
name = "archgrab"
version = "0.1.0"
description = "SNS 미디어 원본 다운로더 (개인용)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "cryptography>=43",
    "aiosqlite>=0.20",
    "yt-dlp>=2025.1.1",
    "gallery-dl>=1.28",
    "httpx>=0.27",
    # yt-dlp 의 TLS 지문 위장에 필요. 없으면 인스타 비로그인 GraphQL 경로가
    # 조용히 비활성되고, 공개 게시글도 "로그인 필요"처럼 실패한다.
    "curl_cffi>=0.7",
]

# 프론트 빌드 산출물(backend/static)이 생기면 setuptools 자동 탐색이
# 최상위 패키지를 두 개로 보고 설치를 거부한다. 패키지를 명시해 막는다.
[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["network: 실제 네트워크를 쓰는 테스트 (기본 제외)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
